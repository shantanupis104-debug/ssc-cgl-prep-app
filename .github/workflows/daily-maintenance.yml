name: Daily Gemini Maintenance

on:
  schedule:
    - cron: '30 1 * * *' # 7:00 AM IST daily
  workflow_dispatch:

jobs:
  update-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI
        run: pip install google-genai

      - name: Run Gemini Updater
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/daily_updater.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cgl_app_database.json index.html
          git diff --quiet && git diff --staged --quiet || git commit -m "daily update via gemini"
          git push origin main
          
